[build]
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[functions."rasi-refresh"]
  schedule = "@daily"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=()"

[[redirects]]
  from = "/rasi/*"
  to = "/rasi-phalalu.html"
  status = 200
