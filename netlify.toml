[build]
  publish = "."
  command = "npm install && npm run build:web"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[functions."rasi-refresh"]
  schedule = "@daily"

[functions."panchang-notify"]
  schedule = "30 1 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=()"

[[redirects]]
  from = "/rasi/*"
  to = "/rasi-phalalu.html"
  status = 200
