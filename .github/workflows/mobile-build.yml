name: Siddha Astro Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Set Android SDK 36
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android release bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: siddha-astro-android-aab
          path: android/app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Add iOS platform
        run: npx cap add ios
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Archive iOS project
        working-directory: ios
        run: xcodebuild -workspace App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/SiddhaAstro.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: siddha-astro-ios-archive
          path: ios/build/SiddhaAstro.xcarchive
